<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recurly.js Example: Adaptive Pricing</title>
    <script src="https://js.recurly.com/v4/recurly.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <script src="/config"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://js.recurly.com/v4/recurly.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet" />
    <link href="/style.css" rel="stylesheet" />
    <style>
      .detection-banner {
        background: #f5f5f5;
        border-left: 3px solid #2C0730;
        padding: 0.6rem 0.75rem;
        margin-bottom: 1.25rem;
        font-size: small;
        color: #2C0730;
      }
      .detection-banner .location {
        font-weight: bold;
      }
      .detection-banner .fallback-note {
        color: gray;
        font-size: x-small;
        display: block;
        margin-top: 0.2rem;
      }
      .price-display {
        background: #f5f5f5;
        padding: 1rem;
        margin-bottom: 1.25rem;
        text-align: center;
      }
      .price-display .amount-now {
        font-size: 2rem;
        font-weight: bold;
        color: #2C0730;
        line-height: 1;
      }
      .price-display .amount-next {
        font-size: small;
        color: gray;
        margin-top: 0.4rem;
      }
      .price-display.loading .amount-now {
        color: #c2c2c2;
      }
      .currency-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1.25rem;
      }
      .currency-btn {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 0.85rem;
        border: 2px solid #d0d0d0;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: bold;
        color: #333;
        white-space: nowrap;
        transition: border-color 0.15s;
      }
      .currency-btn:hover {
        border-color: #999;
      }
      .currency-btn.selected {
        border-color: #1a73e8;
        color: #1a73e8;
      }
      .currency-btn .flag {
        font-size: 1.15rem;
        line-height: 1;
      }
      .name-row {
        display: flex;
        gap: 0.75rem;
      }
      .name-row > div {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Subscribe</h1>

      <div class="detection-banner" id="detection-banner">
        <span id="detection-text">Detecting your location&hellip;</span>
      </div>

      <div class="price-display loading" id="price-display">
        <div class="amount-now" id="price-now">&mdash;</div>
        <div class="amount-next" id="price-next">calculating&hellip;</div>
      </div>

      <form method="post" action="/api/purchases/new">
        <input type="hidden" name="recurly-token" data-recurly="token">
        <input type="hidden" name="currency" id="currency-input" value="USD">
        <input type="hidden" name="subscriptions[][plan-code]" id="plan-code-input">

        <span class="label" id="plan-name">Plan</span>
        <div class="currency-btns" id="currency-btns"></div>

        <div class="name-row">
          <div>
            <label for="first_name">First name</label>
            <input type="text" data-recurly="first_name" id="first_name" name="first-name" placeholder="Jane">
          </div>
          <div>
            <label for="last_name">Last name</label>
            <input type="text" data-recurly="last_name" id="last_name" name="last-name" placeholder="Smith">
          </div>
        </div>

        <label>Card</label>
        <div data-my-js-ref="recurly-element-card"></div>

        <button id="subscribe-btn">Subscribe</button>
        <div id="errors" class="text-muted"></div>
      </form>
    </main>

    <script>
      (function () {
        // Currencies supported by the plan in this example environment
        var SUPPORTED_CURRENCIES = ['USD', 'GBP', 'EUR', 'AUD'];

        var CURRENCY_META = {
          USD: { flag: '🇺🇸', symbol: '$' },
          GBP: { flag: '🇬🇧', symbol: '£' },
          EUR: { flag: '🇪🇺', symbol: '€' },
          AUD: { flag: '🇦🇺', symbol: 'A$' }
        };

        var detectedCurrency = null;
        var detectedCountry = null;
        var availableCurrencies = [];
        var planPriceData = {};
        var pricing;

        // -----------------------------------------------------------------------
        // Step 1: Detect user's location and preferred currency via backend proxy
        // -----------------------------------------------------------------------
        function detectLocation() {
          return fetch('https://api.ipify.org?format=json')
            .then(function (r) { return r.json(); })
            .then(function (data) { return fetch('/api/geoip?ip=' + encodeURIComponent(data.ip)); })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.status === 'success') {
                detectedCountry = data.countryCode;
                detectedCurrency = data.currency;
              }
            })
            .catch(function () {
              // Detection failed — will fall back to plan default
            });
        }

        // -----------------------------------------------------------------------
        // Step 2: Determine best currency for the customer
        //   Preference order:
        //   1. IP-detected currency (if plan supports it)
        //   2. Merchant default (first currency in plan.price)
        //   3. USD
        // -----------------------------------------------------------------------
        function chooseCurrency(available, detected) {
          if (detected && available.indexOf(detected) !== -1) return detected;
          if (available.indexOf('USD') !== -1) return 'USD';
          return available[0];
        }

        // -----------------------------------------------------------------------
        // Step 3: Render flag+price currency buttons and update the banner
        // -----------------------------------------------------------------------
        function renderCurrencySelector(available, chosen) {
          var $container = $('#currency-btns').empty();

          // Only show: detected currency (if plan supports it) + the default fallback
          var defaultCurrency = available.indexOf('USD') !== -1 ? 'USD' : available[0];
          var displayCurrencies = [];
          if (detectedCurrency && available.indexOf(detectedCurrency) !== -1) {
            displayCurrencies.push(detectedCurrency);
          }
          if (displayCurrencies.indexOf(defaultCurrency) === -1) {
            displayCurrencies.push(defaultCurrency);
          }

          displayCurrencies.forEach(function (code) {
            var meta = CURRENCY_META[code] || { flag: '', symbol: code };
            var priceData = planPriceData[code];
            var amount = priceData ? parseFloat(priceData.unit_amount).toFixed(2) : '—';
            var label = meta.symbol + amount;

            var $btn = $('<button>')
              .attr('type', 'button')
              .addClass('currency-btn' + (code === chosen ? ' selected' : ''))
              .attr('data-currency', code)
              .html('<span class="flag">' + meta.flag + '</span>' + label)
              .on('click', function () {
                $('#currency-btns .currency-btn').removeClass('selected');
                $(this).addClass('selected');
                var selected = $(this).attr('data-currency');
                $('#currency-input').val(selected);
                pricing.currency(selected).done();
              });

            $container.append($btn);
          });

          $('#currency-input').val(chosen);
        }

        function renderDetectionBanner(chosen) {
          var html = '';
          if (detectedCountry && detectedCurrency) {
            html = 'Detected location: <span class="location">' + detectedCountry + '</span>';
            if (detectedCurrency === chosen) {
              html += ' &mdash; showing prices in <strong>' + chosen + '</strong>';
            } else {
              html += ' &mdash; ' + detectedCurrency + ' not available, showing <strong>' + chosen + '</strong>';
            }
          } else {
            html = 'Location not detected &mdash; showing prices in <strong>' + chosen + '</strong>';
          }
          $('#detection-text').html(html);
        }

        // -----------------------------------------------------------------------
        // Step 4: Update the price display on pricing change
        // -----------------------------------------------------------------------
        function renderPrice(price) {
          var sym = price.currency.symbol;
          var now = parseFloat(price.now.total).toFixed(2);
          var next = parseFloat(price.next.total).toFixed(2);
          var interval = (price.base && price.base.plan && price.base.plan.interval) || '';

          $('#price-now').text(sym + now);
          $('#price-next').text('then ' + sym + next + ' per period');
          $('#price-display').removeClass('loading');
        }

        // -----------------------------------------------------------------------
        // Step 5: Wire up Recurly and pricing
        // -----------------------------------------------------------------------
        function setup() {
          recurly.configure({ publicKey: window.recurlyConfig.publicKey });

          var elements = recurly.Elements();
          var cardElement = elements.CardElement({
            style: {
              fontFamily: 'Open Sans',
              fontSize: '1rem',
              fontColor: '#2c0730'
            }
          });
          cardElement.attach('[data-my-js-ref="recurly-element-card"]');
          cardElement.on('submit', function () { $('form').submit(); });

          pricing = recurly.Pricing.Subscription();

          // When the plan loads, extract available currencies and pick the best one
          pricing.on('set.plan', function (plan) {
            planPriceData = plan.price || {};
            var planCurrencies = Object.keys(planPriceData);

            // Filter to currencies the plan actually supports (intersect with known set)
            availableCurrencies = planCurrencies.filter(function (c) {
              return SUPPORTED_CURRENCIES.indexOf(c) !== -1;
            });
            if (!availableCurrencies.length) availableCurrencies = ['USD'];

            var chosen = chooseCurrency(availableCurrencies, detectedCurrency);

            renderCurrencySelector(availableCurrencies, chosen);
            renderDetectionBanner(chosen);

            // Show the plan name
            $('#plan-name').text(plan.name || plan.code);

            // Set pricing currency — will trigger a 'change' event with the price
            pricing.currency(chosen).done();
          });

          pricing.on('change', renderPrice);

          pricing.on('error', function (e) {
            console.error('[adaptive-pricing]', e);
          });

          // Load the first plan from config
          var planCode = (window.recurlyConfig.plans[0] || {}).code || 'basic';
          $('#plan-code-input').val(planCode);
          pricing.plan(planCode).done();

          // Form submission
          $('form').on('submit', function (e) {
            e.preventDefault();
            $('#errors').text('');
            $('#subscribe-btn').prop('disabled', true);

            var form = this;
            recurly.token(elements, this, function (err) {
              if (err) {
                $('#errors').text(err.message);
                $('#subscribe-btn').prop('disabled', false);
              } else {
                form.submit();
              }
            });
          });
        }

        // -----------------------------------------------------------------------
        // Boot: detect location first, then set up pricing with that context
        // -----------------------------------------------------------------------
        detectLocation().then(setup);
      }());
    </script>
  </body>
</html>
